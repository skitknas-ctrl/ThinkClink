name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Pushes that only change documentation do not produce a new test build (tags always build).
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Debug APK
        run: ./gradlew --no-daemon -PbuildNumber=${{ github.run_number }} assembleDebug

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk thinkclink-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: thinkclink-debug
          path: thinkclink-debug.apk

      # Rolling test release: a new tag per build (0.1.0-test.<n>) so that Obtainium sees every
      # build as a new version; older test releases are removed. Stable download URL:
      # https://github.com/${{ github.repository }}/releases/latest/download/thinkclink-debug.apk
      - name: Publish test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.1.0-test.${{ github.run_number }}
        run: |
          # keep the three newest test releases so a client that already fetched the release list
          # (Obtainium, a browser tab) can still download; delete the rest
          for old in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^testbuild$|-test\.[0-9]+$' | sort -t. -k4,4n -r | tail -n +3 || true); do
            gh release delete "$old" --cleanup-tag --yes || true
          done
          gh release create "$VERSION" thinkclink-debug.apk \
            --latest \
            --title "Testbygge $VERSION" \
            --notes "Automatiskt bygge av commit ${GITHUB_SHA::7}. Signerat med test-nyckeln; kan installeras ovanpå tidigare testbyggen."

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore (if the secret exists)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > release.keystore; else echo "No release keystore secret – APK will be unsigned"; fi
      - name: Release APK
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release*.apk thinkclink-${GITHUB_REF_NAME}.apk
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" thinkclink-${GITHUB_REF_NAME}.apk --title "ThinkClink ${GITHUB_REF_NAME}" --generate-notes
